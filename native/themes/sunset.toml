# Dusk at the beach: purple sky into coral, sun sinking behind the waves.
# Port of [data-theme='sunset'] in src/styles.css. Lengths: `em` = letter size,
# `face` = share of the clock face's shorter side, `view` = share of the screen's shorter side.
name = "Sunset"

[page]
fill = { linear = { angle = 180, stops = [["#1b1733", 0.0], ["#3a1f45", 0.55], ["#6b2c4f", 1.0]] } }

[face]
radius = 0.03
# Bottom to top.
layers = [
  { linear = { angle = 180, stops = [["#211c42", 0.0], ["#4b2461", 0.38], ["#a23f68", 0.72], ["#e8706a", 1.0]] } },
  { radial = { x = 0.5, y = 0.92, stops = [["#ffd27a", 0.0], ["#ffd27a", 0.07], ["#ffa05a8c", 0.09], ["#ffa05a00", 0.30]] } },
  { path = { d = "M0 34 Q50 18 100 34 T200 34 T300 34 T400 34 V80 H0Z", view = [400, 80], fill = "#1d7a83", box = [0.0, 0.84, 1.0, 0.16] } },
  { path = { d = "M0 52 Q50 36 100 52 T200 52 T300 52 T400 52 V80 H0Z", view = [400, 80], fill = "#0c4a5e", box = [0.0, 0.84, 1.0, 0.16] } },
]

[chars]
weight_off = 250
weight_on = 480
off = "#ffe6dc2b"
on = "#fff4e6"
glow = [{ blur = 0.3, color = "#ffaa78d9" }, { blur = 0.9, color = "#ff6e6e66" }]

[dots]
off = "#ffe6dc29"
colors = ["#ff6b6b", "#ffb84d", "#4fd6c4", "#b79cff"]
glow = [{ blur = 0.012 }, { blur = 0.03 }]

[caption]
color = "#fff4e6"

# Glowing embers drifting up.
[ambient]
motion = "rise"
size = 0.009
round = true
duration = 16.0
opacity = 0.8
colors = ["#ffb347", "#ff7a3d", "#ffd27a"]
glow = 0.01
