# Yellow blocks on black, the Formrausch look. Port of [data-theme='formrausch'] in src/styles.css
# (without the page's photo texture).
name = "Formrausch"

[page]
fill = { solid = "#111111" }

[face]
radius = 0.0
layers = [
  { radial = { x = 0.5, y = 0.5, ellipse = true, stops = [["#ffffff40", 0.0], ["#ffffff05", 0.6], ["#ffffff00", 1.0]] } },
  { solid = "#00000080" },
]

[chars]
weight_off = 300
weight_on = 560
off = "#ffe40033"
on = "#000000"
# Opaque, pre-blended over the dark face: overlapping cell blocks would show seams at 90 %.
on_background = "#e8cf03"
glow = []

[dots]
shape = "cross"
off = "#00000000"
colors = ["#ffe400", "#ffe400", "#ffe400", "#ffe400"]
glow = []

[caption]
color = "#ffe400"
