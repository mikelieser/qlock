[package]
name = "qlock-render"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Turns clock frames and theme data into sprites and per-frame instances. Shared by all native targets."

[dependencies]
qlock-core = { workspace = true }
serde = { workspace = true, features = ["std"] }
serde_json = { workspace = true }
toml = "1"
tiny-skia = "0.12"
ab_glyph = "0.2.32"
resvg = { version = "0.49", default-features = false, features = ["raster-images"] }
percent-encoding = "2"
